name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies & Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ORIGIN: ${{ secrets.VITE_APP_ORIGIN }}
          VITE_MAIN_SITE_URL: ${{ secrets.VITE_MAIN_SITE_URL }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: SPA Routing & Custom Domain Fix
        run: |
          cp dashboard/dist/index.html dashboard/dist/404.html
          echo "bilgi.openstacktool.com" > dashboard/dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dashboard/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5