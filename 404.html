<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yönlendiriliyor...</title>
    <script>
      const pathSegments = window.location.pathname.split("/").filter(Boolean);
      const lastSegment = pathSegments[pathSegments.length - 1];
      const routePath = "/" + pathSegments.join("/");
      const legalRoutes = {
        "/privacy": "/privacy-policy.html",
        "/terms": "/terms-of-service.html",
        "/cookie-policy": "/cookie-policy.html",
        "/kvkk-gdpr": "/kvkk-gdpr.html",
      };

      if (legalRoutes[routePath]) {
        window.location.replace(legalRoutes[routePath]);
      } else if (pathSegments[0] === "c" && pathSegments.length === 2) {
        window.location.replace(
          `/informationpage/index.html?slug=${encodeURIComponent(lastSegment)}`,
        );
      } else {
        document.title = "Sayfa Bulunamadı";
        document.body.innerHTML = `
          <main>
            <h1>Sayfa bulunamadı</h1>
            <p>İstediğiniz sayfa mevcut değil.</p>
            <a href="/">Ana sayfaya dön</a>
          </main>
        `;
      }
    </script>
  </head>
  <body>
    <p>Yönlendiriliyor...</p>
  </body>
</html>
