<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yönlendiriliyor...</title>
    <script>
      const pathSegments = window.location.pathname.split("/").filter(Boolean);
      const lastSegment = pathSegments[pathSegments.length - 1];
      const routePath = "/" + pathSegments.join("/");
      const legalRoutes = {
        "/privacy": "https://bilgi.openstacktool.com/en/privacy-policy",
        "/privacy-policy": "https://bilgi.openstacktool.com/en/privacy-policy",
        "/terms": "https://bilgi.openstacktool.com/en/terms-of-service",
        "/terms-of-service": "https://bilgi.openstacktool.com/en/terms-of-service",
        "/cookie-policy": "https://bilgi.openstacktool.com/en/cookie-policy",
        "/kvkk-gdpr": "https://bilgi.openstacktool.com/tr/kvkk",
        "/kvkk": "https://bilgi.openstacktool.com/tr/kvkk",
      };

      if (legalRoutes[routePath]) {
        window.location.replace(legalRoutes[routePath]);
      } else if (pathSegments[0] === "c" && pathSegments.length === 2) {
        window.location.replace(
          `/informationpage/index.html?slug=${encodeURIComponent(lastSegment)}`,
        );
      } else {
        document.title = "Sayfa Bulunamadı";
        document.body.innerHTML = `
          <main>
            <h1>Sayfa bulunamadı</h1>
            <p>İstediğiniz sayfa mevcut değil.</p>
            <a href="/">Ana sayfaya dön</a>
          </main>
        `;
      }
    </script>
  </head>
  <body>
    <p>Yönlendiriliyor...</p>
  </body>
</html>
