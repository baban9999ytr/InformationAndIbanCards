    <script>
      const query = new URLSearchParams(window.location.search);
      const lang = query.get("lang") === "tr" ? "tr" : "en";
      const requestedDocument = query.get("document");
      const paths = lang === "tr"
        ? { terms: "/tr/kullanim-kosullari", privacy: "/tr/gizlilik-politikasi", kvkk: "/tr/kvkk", cookies: "/tr/cerez-politikasi", contact: "/tr/iletisim" }
        : { terms: "/en/terms-of-service", privacy: "/en/privacy-policy", kvkk: "/en/gdpr", cookies: "/en/cookie-policy", contact: "/en/contact" };
      const otherLanguagePaths = lang === "tr"
        ? { terms: "/en/terms-of-service", privacy: "/en/privacy-policy", kvkk: "/en/gdpr", cookies: "/en/cookie-policy", contact: "/en/contact" }
        : { terms: "/tr/kullanim-kosullari", privacy: "/tr/gizlilik-politikasi", kvkk: "/tr/kvkk", cookies: "/tr/cerez-politikasi", contact: "/tr/iletisim" };
      const titles = lang === "tr"
        ? { terms: "Kullanım Koşulları", privacy: "Gizlilik Politikası", kvkk: "KVKK Aydınlatma ve GDPR Bilgilendirmesi", cookies: "Çerez ve Tarayıcı Depolama Politikası", contact: "İletişim" }
        : { terms: "Terms of Service", privacy: "Privacy Policy", kvkk: "KVKK Disclosure and GDPR Notice", cookies: "Cookie and Browser Storage Policy", contact: "Contact" };
      const draftNotice = lang === "tr"
        ? `<aside class="draft"><strong>TASLAK — yayımdan önce inceleme gerekir.</strong> Bu metin, mevcut kod ve yapılandırma belgelerinden hazırlanmıştır. Veri sorumlusu tüzel kişi/adres bilgisi, saklama süreleri, veri merkezi konumu, uluslararası aktarım mekanizması ve yürürlük tarihi operatör tarafından doğrulanmalı; KVKK/GDPR uzmanı tarafından gözden geçirilmelidir.</aside>`
        : `<aside class="draft"><strong>DRAFT — review required before publication.</strong> Prepared from the current code and configuration documentation. The controller's legal entity/address, retention periods, hosting region, international-transfer mechanism, and effective date must be verified by the operator and reviewed by qualified privacy counsel.</aside>`;
      const legalText = {
        en: {
          terms: `<p>These terms govern your use of Bilgi NFC and digital-card services. By creating an account or using an account-only feature, you agree to these terms and the linked notices. Do not use the service if you do not agree.</p>
            <h2>Eligibility and accounts</h2><p>You must meet the minimum age required by your country and provide accurate account information. Email registration requires email verification. Google sign-in is provided through Supabase Auth and Google. Keep your credentials and private card links confidential; you are responsible for activity under your account.</p>
            <h2>Cards and information you publish</h2><p>You are responsible for having the rights and authority to submit names, contact details, bank-account details, review links, images, and other content. Public-card fields and their public URLs can be viewed by anyone with access to the page and may be copied or indexed by third parties. Private-card URLs act as bearer links: anyone who obtains one may be able to view that card. Do not put confidential information in a public card or share a private link as if it were access-controlled to a named recipient.</p>
            <h2>Acceptable use</h2><p>Do not use the service for unlawful, deceptive, infringing, abusive, or unauthorized activity; to expose another person's data without authority; to send unsolicited messages; or to interfere with the service. We may investigate abuse reports and suspend or disable content or accounts where reasonably necessary for security, legal compliance, or service integrity.</p>
            <h2>Feedback and third-party services</h2><p>Feedback submitted through a card may be stored for the card owner and may include a message, optional contact detail, rating, and timestamp. External links, including Google Maps, WhatsApp, Instagram, email, and SMS, are operated by third parties under their own terms. URL safety checks may send submitted URLs to VirusTotal; never submit confidential or bearer-token URLs for scanning.</p>
            <h2>Availability, liability, and changes</h2><p>The service is provided as available. We do not provide banking, payment-processing, financial, or legal advice; verify account details with the intended recipient before transferring funds. To the extent permitted by applicable law, the operator is not liable for indirect loss or third-party actions. Nothing here excludes liability that cannot lawfully be excluded or limits your mandatory consumer rights. We may update these terms; material updates will be posted with a revised effective date.</p>
            <h2>Contact</h2><p>For questions or notices, contact <a href="mailto:destek@openstacktool.com">destek@openstacktool.com</a>. The operator's full legal identity and address must be completed in this draft before publication.</p>`,
          privacy: `<p>This notice explains personal-data handling when you use Bilgi NFC, manage digital cards, or visit a public card. The service operator/controller identity and address must be completed before publication. Effective date: pending operator approval.</p>
            <h2>Data we process</h2><ul><li><strong>Account and authentication:</strong> name, email, optional phone number, account identifiers, sign-in provider, verification state, and authentication/session tokens handled by Supabase Auth. Google may provide account profile details when you choose Google sign-in. The application does not receive your Google password.</li><li><strong>Preferences and consent:</strong> required terms/privacy and age confirmation timestamps, optional marketing preference, account type, onboarding completion, interface language and theme.</li><li><strong>Card content:</strong> card title, access mode, public slug or private capability link, contact/social links, bank name, account-holder name and IBAN when entered, review destination, NFC settings, and operator notes for managed cards.</li><li><strong>Feedback and abuse reports:</strong> ratings, messages, optional customer contact information, reported URL, reporter email if supplied, report category/details, status, and timestamps.</li><li><strong>Technical data:</strong> request and security data processed by Supabase, Cloudflare, and configured service providers. Exact logs, IP-address handling, and retention depend on deployed provider settings and must be confirmed by the operator.</li></ul>
            <h2>Purposes and legal grounds</h2><p>Data is used to create and secure accounts; provide card creation, display, NFC, feedback, moderation, export and deletion functions; respond to support and abuse reports; maintain and protect the service; meet legal obligations; and, only where enabled and opted into, send product news. The operator must document the applicable legal basis for each purpose (for example, contract necessity, legal obligation, legitimate interests after balancing, or consent) before publication. Marketing consent is optional and can be withdrawn.</p>
            <h2>Public cards and sharing</h2><p>Information deliberately placed on a public card is available to visitors. A private card uses a hard-to-guess capability URL; possession of that URL may grant access, so treat it as a secret. The service does not promise that recipients will keep copied or shared data confidential.</p>
            <h2>Recipients and international transfers</h2><p>Service providers documented in this repository include Supabase (authentication and database), Cloudflare (static hosting/API Worker), Google (OAuth and linked Google destinations), and VirusTotal (submitted URLs for URL safety checks). Supabase Auth email/SMS delivery may use providers configured in the Supabase project. Providers may process data under their own terms and locations. The operator must verify the actual provider list, regions, subprocessors, transfer destinations, and applicable transfer safeguards before publication; this draft does not assert a specific transfer mechanism.</p>
            <h2>Retention and security</h2><p>Account data and related records are retained while needed to provide the service and then deleted or retained only where a documented legal/security need applies. Account deletion is available in the dashboard and is designed to delete the user and cascade related database records; backups and provider logs may persist for provider-defined periods. The operator must insert actual retention periods and backup/log schedules before publication. Access controls, row-level security, token validation, and HTTPS are used where configured, but no online service can guarantee absolute security.</p>
            <h2>Your choices and rights</h2><p>You can update account/card data, export available account data, delete your account, and withdraw optional marketing consent through available settings or by contacting us. Depending on applicable law, you may have rights to access, correct, delete, restrict, object, portability, withdraw consent, and complain to a supervisory authority. Contact <a href="mailto:destek@openstacktool.com">destek@openstacktool.com</a>. We may need to verify your identity before responding.</p>
            <h2>Children and updates</h2><p>The service is not intended for people below the minimum age applicable in their country. The operator must confirm the applicable age rules and response process before publication. We will post material changes here with a new effective date.</p>`,
          kvkk: `<p>This draft supplements the Privacy Policy for Turkish Personal Data Protection Law No. 6698 (KVKK) and, where applicable, the EU/UK GDPR. It is not a legal determination of applicability or compliance. Controller identity/address and the effective date must be completed by the operator.</p>
            <h2>Data categories and purposes</h2><p>Depending on the features used, processed categories may include identity and contact details; account/authentication identifiers; customer-transaction or financial information that you choose to enter (including IBAN and account-holder name); user transaction and content records (cards, feedback, reports); consent and preference records; and technical/security records. Purposes include account and service operation, displaying cards, handling feedback and abuse, security, support, legal compliance, and optional marketing where separately chosen.</p>
            <h2>Collection, legal grounds, and recipients</h2><p>Data is collected directly from users, through sign-in providers, from visitors who submit feedback or abuse reports, and automatically by the application or hosting/authentication providers. KVKK Article 5/6 legal grounds and, if applicable, GDPR Article 6 grounds must be mapped by the controller for each purpose; consent is used only where it is the proper legal ground and can be withdrawn. Potential recipients include Supabase, Cloudflare, Google, VirusTotal for URLs submitted to scanning, and configured authentication message providers. The actual recipients and data transfers must be verified.</p>
            <h2>Transfers and retention</h2><p>Provider locations and international transfers have not been established in this draft. Before publication the controller must identify each destination and document the applicable KVKK transfer safeguard (including any required standard contract/notification steps) and GDPR transfer safeguard where relevant. Retention periods for active accounts, reports, logs, and backups must be stated based on the deployed configuration and applicable retention obligations; do not treat this draft as setting those periods.</p>
            <h2>Data-subject rights and applications</h2><p>Under KVKK Article 11, you may have rights to learn whether data is processed, request information, learn processing purposes and recipients, request correction/deletion/destruction where permitted, seek notification of those actions, object to certain outcomes, and claim compensation for unlawful processing. GDPR rights may also apply, including access, rectification, erasure, restriction, portability, objection, and complaint to a supervisory authority. Send a request to <a href="mailto:destek@openstacktool.com">destek@openstacktool.com</a> with enough information to verify your identity. The controller must publish its legal name, address, application method, and applicable response times here before release.</p>
            <h2>Optional marketing and account consent</h2><p>Product-update email is optional and is not required to use the service. Required account terms/age confirmations and any separate consent are recorded with timestamps where the applicable flow requests them. You can withdraw optional marketing consent without affecting prior lawful processing.</p>`,
          cookies: `<p>This policy covers cookies and similar browser storage used by the current application. Provider behavior can vary by deployment. Effective date: pending operator approval.</p>
            <h2>Storage used by the application</h2><ul><li>The dashboard stores a light/dark theme preference and interface-language preference in browser local storage.</li><li>Supabase Auth persists the signed-in session in browser storage according to the configured Supabase client defaults. This is necessary for sign-in and protected account features.</li><li>Static hosting, authentication, OAuth, and linked third-party services may set or read their own cookies or similar storage when used. Their exact names, duration, and purposes must be confirmed from production provider settings before publication.</li></ul>
            <h2>Choices</h2><p>Browser settings let you inspect, block, or remove local storage and cookies. Blocking authentication storage will prevent persistent sign-in; clearing theme/language storage resets those preferences. The dashboard currently has no documented analytics or advertising-cookie integration. If optional analytics or advertising is added, this notice and any required consent controls must be updated before deployment.</p>
            <h2>Contact</h2><p>Questions: <a href="mailto:destek@openstacktool.com">destek@openstacktool.com</a>.</p>`,
          contact: `<p>For privacy requests, account questions, legal notices, or general feedback, email <a href="mailto:destek@openstacktool.com">destek@openstacktool.com</a>.</p><p>To report an unsafe or abusive public card, use the report control on the card page. Do not email passwords, authentication codes, private card links, or full payment credentials.</p><p>The service operator's complete legal identity and postal address should be added here before publication.</p>`,
        },
        tr: {
          terms: `<p>Bu koşullar Bilgi NFC ve dijital kart hizmetlerinin kullanımını düzenler. Hesap oluşturarak veya hesap gerektiren bir özelliği kullanarak bu koşulları ve bağlantılı bilgilendirmeleri kabul etmiş olursunuz. Kabul etmiyorsanız hizmeti kullanmayın.</p>
            <h2>Uygunluk ve hesaplar</h2><p>Ülkenizde geçerli asgari yaş şartını karşılamalı ve doğru hesap bilgileri vermelisiniz. E-posta ile kayıt için e-posta doğrulaması gerekir. Google ile giriş Supabase Auth ve Google üzerinden sağlanır. Kimlik bilgilerinizi ve özel kart bağlantılarınızı koruyun; hesabınızdaki işlemlerden sorumlusunuz.</p>
            <h2>Kartlar ve yayımladığınız bilgiler</h2><p>Ad, iletişim bilgisi, banka hesabı bilgisi, yorum bağlantısı, görsel ve diğer içerikleri paylaşmaya yetkili olduğunuzdan siz sorumlusunuz. Herkese açık karta ve bağlantısına erişebilen herkes kartı görebilir; üçüncü taraflar içeriği kopyalayabilir veya dizine ekleyebilir. Özel kart bağlantısı erişim anahtarı gibi çalışır; bağlantıyı edinen kişiler kartı görüntüleyebilir. Gizli bilgileri herkese açık karta koymayın ve özel bağlantıyı yalnızca belirli kişilerin erişebildiği bir sistem gibi değerlendirmeyin.</p>
            <h2>Kabul edilebilir kullanım</h2><p>Hizmeti hukuka aykırı, yanıltıcı, ihlal edici, taciz edici veya yetkisiz faaliyetlerde; başkasının verisini izinsiz yayımlamakta; istenmeyen ileti göndermekte veya hizmeti aksatmakta kullanmayın. Güvenlik, hukuka uyum veya hizmet bütünlüğü için gerekli olduğunda bildirimleri inceleyebilir ve içerik/hesapları askıya alabilir ya da devre dışı bırakabiliriz.</p>
            <h2>Geri bildirim ve üçüncü taraf hizmetleri</h2><p>Kart üzerinden iletilen geri bildirim kart sahibi için saklanabilir ve mesaj, isteğe bağlı iletişim bilgisi, puan ve zaman damgası içerebilir. Google Haritalar, WhatsApp, Instagram, e-posta ve SMS gibi harici hedefler kendi koşullarına tabi üçüncü taraflarca işletilir. URL güvenlik kontrolü, gönderilen URL'leri VirusTotal'e iletebilir; gizli veya erişim anahtarı içeren bağlantıları taratmayın.</p>
            <h2>Hizmet, sorumluluk ve değişiklikler</h2><p>Hizmet mevcut olduğu şekilde sunulur. Bankacılık, ödeme aracılığı, finansal veya hukuki danışmanlık sağlamıyoruz; para göndermeden önce hesap bilgilerini alıcıyla doğrulayın. Uygulanabilir hukukun izin verdiği ölçüde dolaylı zararlardan ve üçüncü taraf eylemlerinden sorumluluk kabul edilmez. Kanunen hariç tutulamayacak sorumluluklar veya zorunlu tüketici hakları saklıdır. Koşulları güncelleyebilir, önemli değişiklikleri yeni yürürlük tarihiyle yayımlayabiliriz.</p>
            <h2>İletişim</h2><p>Sorular ve bildirimler için <a href="mailto:destek@openstacktool.com">destek@openstacktool.com</a> adresine yazın. Yayımdan önce işletmecinin tam hukuki kimliği ve adresi bu taslağa eklenmelidir.</p>`,
          privacy: `<p>Bu metin Bilgi NFC kullanırken, dijital kartları yönetirken veya herkese açık bir kartı ziyaret ederken kişisel verilerin nasıl işlendiğini açıklar. Hizmet işletmecisi/veri sorumlusunun kimliği ve adresi yayımdan önce eklenmelidir. Yürürlük tarihi: işletmeci onayı bekleniyor.</p>
            <h2>İşlenen veriler</h2><ul><li><strong>Hesap ve kimlik doğrulama:</strong> ad, e-posta, isteğe bağlı telefon, hesap tanımlayıcıları, giriş sağlayıcısı, doğrulama durumu ve Supabase Auth tarafından işlenen oturum belirteçleri. Google ile girişte Google hesap profilini sağlayabilir; uygulama Google parolanızı almaz.</li><li><strong>Tercihler ve onay:</strong> zorunlu koşul/gizlilik ve yaş onayı zamanları, isteğe bağlı pazarlama tercihi, hesap türü, başlangıç adımı durumu, arayüz dili ve tema.</li><li><strong>Kart içeriği:</strong> kart başlığı, erişim biçimi, herkese açık kısa ad veya özel erişim bağlantısı, iletişim/sosyal bağlantıları, girilmesi halinde banka adı, hesap sahibi ve IBAN, yorum hedefi, NFC tercihleri ve yönetilen kartlar için işletmeci notları.</li><li><strong>Geri bildirim ve kötüye kullanım bildirimleri:</strong> puanlar, mesajlar, isteğe bağlı müşteri iletişim bilgisi, bildirilen URL, sağlanırsa bildirenin e-postası, bildirim kategorisi/açıklaması, durum ve zaman damgaları.</li><li><strong>Teknik veriler:</strong> Supabase, Cloudflare ve yapılandırılmış sağlayıcıların işlediği istek ve güvenlik verileri. Günlüklerin, IP adresi işlemenin ve saklama süresinin kesin kapsamı canlı sağlayıcı ayarlarına bağlıdır ve işletmeci tarafından doğrulanmalıdır.</li></ul>
            <h2>Amaçlar ve hukuki sebepler</h2><p>Veriler hesap oluşturma ve güvenliği; kart oluşturma, görüntüleme, NFC, geri bildirim, moderasyon, dışa aktarma ve silme özellikleri; destek ve bildirimlere yanıt; hizmetin işletilmesi ve korunması; hukuki yükümlülükler; yalnızca etkinleştirilip ayrıca tercih edilmesi halinde ürün bilgilendirmeleri için kullanılır. Her amaç için uygulanacak hukuki sebep (örneğin sözleşmenin ifası, hukuki yükümlülük, dengeleme testine tabi meşru menfaat veya açık rıza) yayımdan önce işletmeci tarafından belirlenmelidir. Pazarlama tercihi isteğe bağlıdır ve geri alınabilir.</p>
            <h2>Herkese açık kartlar ve paylaşım</h2><p>Herkese açık karta özellikle eklenen bilgiler ziyaretçilere açıktır. Özel kart, tahmin edilmesi güç bir erişim bağlantısı kullanır; bağlantıya sahip olmak erişim sağlayabilir, bu nedenle gizli tutun. Alıcıların kopyalanan veya paylaşılan bilgileri gizli tutacağını garanti etmiyoruz.</p>
            <h2>Alıcılar ve yurt dışına aktarım</h2><p>Bu depoda belgelenen hizmet sağlayıcıları Supabase (kimlik doğrulama ve veritabanı), Cloudflare (statik barındırma/API Worker), Google (OAuth ve bağlantılı Google hedefleri) ve URL güvenlik kontrolüne gönderilen URL'ler için VirusTotal'dir. Supabase Auth e-posta/SMS iletimi, proje ayarlarında yapılandırılan sağlayıcıları kullanabilir. Sağlayıcılar kendi koşulları ve lokasyonlarında veri işleyebilir. Gerçek sağlayıcı listesi, bölgeler, alt işleyenler, aktarım noktaları ve geçerli güvence mekanizmaları yayımdan önce doğrulanmalıdır; bu taslak belirli bir aktarım mekanizmasının mevcut olduğunu ileri sürmez.</p>
            <h2>Saklama ve güvenlik</h2><p>Hesap ve ilişkili kayıtlar hizmet sunumu için gerekli olduğu sürece saklanır; sonrasında silinir veya belgelenmiş hukuki/güvenlik gereklilikleri kapsamında tutulur. Panelden hesap silme özelliği vardır ve kullanıcıyla ilişkili veritabanı kayıtlarının silinmesi için zincirleme silme tasarlanmıştır; yedekler ve sağlayıcı günlükleri sağlayıcıların belirlediği süre boyunca kalabilir. Gerçek saklama süreleri ve yedek/günlük çizelgesi yayımdan önce eklenmelidir. Yapılandırıldığı ölçüde erişim kontrolleri, satır düzeyinde güvenlik, belirteç doğrulama ve HTTPS kullanılır; hiçbir çevrimiçi hizmet mutlak güvenlik garantisi veremez.</p>
            <h2>Haklarınız ve tercihleriniz</h2><p>Hesap/kart bilgilerini güncelleyebilir, mevcut hesap verilerini dışa aktarabilir, hesabı silebilir ve isteğe bağlı pazarlama tercihini ayarlardan veya bize başvurarak geri alabilirsiniz. Uygulanabilir hukuka göre erişim, düzeltme, silme, kısıtlama, itiraz, taşınabilirlik, rızayı geri çekme ve denetim makamına şikâyet haklarınız olabilir. <a href="mailto:destek@openstacktool.com">destek@openstacktool.com</a> adresinden başvurun; yanıt öncesinde kimliğinizi doğrulamamız gerekebilir.</p>
            <h2>Çocuklar ve güncellemeler</h2><p>Hizmet, bulunduğunuz ülkedeki asgari yaşın altındaki kişiler için tasarlanmamıştır. Uygulanacak yaş kuralları ve başvuru yöntemi yayımdan önce doğrulanmalıdır. Önemli değişiklikler yeni yürürlük tarihiyle burada yayımlanır.</p>`,
          kvkk: `<p>Bu taslak, 6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) ve uygulanabildiği ölçüde AB/İngiltere GDPR kapsamında bilgilendirme amacı taşır. Kanunların uygulanabilirliği veya uyum hakkında hukuki tespit değildir. Veri sorumlusunun kimliği/adresi ve yürürlük tarihi işletmeci tarafından tamamlanmalıdır.</p>
            <h2>Veri kategorileri ve amaçlar</h2><p>Kullanılan özelliklere bağlı olarak kimlik ve iletişim bilgileri; hesap/kimlik doğrulama tanımlayıcıları; kullanıcının girdiği müşteri işlem veya finans bilgileri (IBAN ve hesap sahibi dahil); kart, geri bildirim ve bildirimlerden oluşan işlem/içerik kayıtları; onay ve tercih kayıtları; teknik ve güvenlik kayıtları işlenebilir. Amaçlar hesap ve hizmet işletimi, kartları gösterme, geri bildirim ve kötüye kullanımı ele alma, güvenlik, destek, hukuki yükümlülükler ve ayrıca tercih edilmesi halinde isteğe bağlı pazarlamadır.</p>
            <h2>Toplama, hukuki sebep ve alıcılar</h2><p>Veriler doğrudan kullanıcılardan, giriş sağlayıcılarından, geri bildirim veya kötüye kullanım bildirimi gönderen ziyaretçilerden ve uygulama/barındırma/kimlik doğrulama sağlayıcılarından toplanabilir. KVKK m. 5/6 ve uygulanması halinde GDPR m. 6 hukuki sebepleri her amaç için veri sorumlusu tarafından belirlenmelidir; rıza yalnızca uygun hukuki sebep olduğu hallerde kullanılmalı ve geri alınabilmelidir. Muhtemel alıcılar Supabase, Cloudflare, Google, tarama için gönderilen URL'lerde VirusTotal ve yapılandırılmış kimlik doğrulama ileti sağlayıcılarıdır. Gerçek alıcılar ve aktarımlar doğrulanmalıdır.</p>
